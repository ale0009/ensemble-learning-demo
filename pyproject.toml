[project]
name = "ensemble-learning-demo"
version = "0.1.0"
description = "Comparación reproducible de clasificadores y métodos de ensamble"
readme = "README.md"
authors = [{ name = "Equipo del proyecto" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
]

[project.scripts]
ensemble-demo = "ensemble_demo.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ensemble_demo"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
